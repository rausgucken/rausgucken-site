<!DOCTYPE html>
<html lang="de-DE">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#1E1B1A" media="(prefers-color-scheme: dark)"/>
  <title>Offline – rausgucken.de</title>
  <style>
    :root{--bg:#FBF7F0;--text:#1E1B1A;--muted:#5E5A55;--logo:#C2382D;--btn:#F2685D;--ink:#1E1B1A;--line:#1E1B1A;}
    @media (prefers-color-scheme: dark){
      :root{--bg:#1E1B1A;--text:#F5F0E6;--muted:#B5ADA2;--logo:#F2685D;--line:#F5F0E6;}
    }
    body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);
         display:flex;align-items:center;justify-content:center;
         min-height:100vh;margin:0;text-align:center;padding:2rem;}
    .card{max-width:380px;}
    .logo{font-family:Georgia,'Times New Roman',serif;font-size:2rem;font-weight:700;color:var(--logo);margin-bottom:1rem;}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:1.4rem;margin-bottom:0.75rem;}
    p{color:var(--muted);font-size:1rem;line-height:1.6;}
    a{display:inline-flex;align-items:center;min-height:44px;margin-top:1.5rem;padding:0 1.5rem;
      background:var(--btn);color:var(--ink);border:1.5px solid var(--line);border-radius:0;
      text-decoration:none;font-weight:600;}
    a:focus-visible{outline:2px solid var(--logo);outline-offset:2px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">rausgucken.de</div>
    <h1>Gerade offline</h1>
    <p>Du bist momentan nicht mit dem Internet verbunden. Sobald du wieder online bist, werden alle Veranstaltungen geladen.</p>
    <a href="/">Erneut versuchen</a>
  </div>
</body>
</html>
